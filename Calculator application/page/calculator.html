<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/calculatorFunction.js"></script>
</head>

<body>
    <!-- <div class="form-row"> -->
    <div class="container">
        <div class="image-container">
            <img src="../image/calculatorImage.png" alt="Calculator Image" class="calculator-image">
        </div>
        <div class="form-container">
            <h2 class="header-label"> Calculator Application</h2>
            <div class="form-row">
                <label for="firstNumber"> FirstNumber: </label>
                <input type="text" id="firstNumber" />
            </div>
            <div class="form-row">
                <label for="secondNumber"> SecondNumber: </label>
                <input type="text" id="secondNumber" />
            </div>
            <div class="form-row">
                <label for="result"> Result: </label>
                <input type="text" id="result" />
            </div>
            <div class="button-container">
                <button id="addOp" class="add" onclick="addOperation()">Add</button>
                <button id="subOp" class="sub" onclick="subOperation()">Sub</button>
                <button id="mulOp" class="mul" onclick="mulOperation()">Mul</button>
                <button id="divOp" class="div" onclick="divOperation()">Div</button>
            </div>
        </div>
    </div>

</body>

</html>
